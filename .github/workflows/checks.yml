name: Mathematical certificates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/certify.py
      - run: python examples/statistical_family.py
      - run: python examples/gated_rows.py
      - run: python examples/certified_challenges.py
      - run: python examples/certified_fourier.py
      - run: python examples/bounded_restarts.py
      - run: python examples/filtered_folding.py
      - run: python examples/bounded_energy.py
      - run: python examples/refined_loss.py
      - run: python research/scripts/verify_archive.py
